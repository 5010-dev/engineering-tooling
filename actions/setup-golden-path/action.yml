name: Set up Golden Path
description: Install an exact checksum-verified Golden Path release executable.
inputs:
  checker-version:
    description: Exact Golden Path release version.
    required: true
  darwin-amd64-sha256:
    description: SHA-256 of the Darwin amd64 release archive.
    required: true
  darwin-arm64-sha256:
    description: SHA-256 of the Darwin arm64 release archive.
    required: true
  linux-amd64-sha256:
    description: SHA-256 of the Linux amd64 release archive.
    required: true
  linux-arm64-sha256:
    description: SHA-256 of the Linux arm64 release archive.
    required: true
outputs:
  binary-path:
    description: Absolute path to the verified Golden Path executable.
    value: ${{ steps.install.outputs.binary-path }}
runs:
  using: composite
  steps:
    - id: install
      name: Install verified executable
      shell: bash
      env:
        CHECKER_VERSION: ${{ inputs.checker-version }}
        DARWIN_AMD64_SHA256: ${{ inputs.darwin-amd64-sha256 }}
        DARWIN_ARM64_SHA256: ${{ inputs.darwin-arm64-sha256 }}
        LINUX_AMD64_SHA256: ${{ inputs.linux-amd64-sha256 }}
        LINUX_ARM64_SHA256: ${{ inputs.linux-arm64-sha256 }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          macOS/X64) os=darwin; architecture=amd64; expected="$DARWIN_AMD64_SHA256" ;;
          macOS/ARM64) os=darwin; architecture=arm64; expected="$DARWIN_ARM64_SHA256" ;;
          Linux/X64) os=linux; architecture=amd64; expected="$LINUX_AMD64_SHA256" ;;
          Linux/ARM64) os=linux; architecture=arm64; expected="$LINUX_ARM64_SHA256" ;;
          *) printf '%s\n' 'Unsupported Golden Path runner.' >&2; exit 2 ;;
        esac
        archive="golden-path_${CHECKER_VERSION}_${os}_${architecture}.tar.gz"
        staging="$(mktemp -d "${RUNNER_TEMP}/golden-path.XXXXXX")"
        trap 'rm -rf "$staging"' EXIT HUP INT TERM
        curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 120 \
          --output "$staging/$archive" \
          "https://github.com/5010-dev/engineering-tooling/releases/download/v${CHECKER_VERSION}/$archive"
        actual="$(shasum -a 256 "$staging/$archive" | awk '{print $1}')"
        test "$actual" = "$expected"
        mkdir "$staging/unpacked"
        tar -xzf "$staging/$archive" -C "$staging/unpacked"
        candidate="$staging/unpacked/golden-path/golden-path"
        chmod 0755 "$candidate"
        test "$("$candidate" --version)" = "golden-path $CHECKER_VERSION"
        install_directory="$RUNNER_TEMP/golden-path/$CHECKER_VERSION"
        mkdir -p "$install_directory"
        install -m 0755 "$candidate" "$install_directory/golden-path"
        printf 'binary-path=%s\n' "$install_directory/golden-path" >> "$GITHUB_OUTPUT"
