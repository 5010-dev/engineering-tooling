schemaVersion: golden-path-generator-request/v1
materializationMode: bootstrap
layout: polyglot
projectName: Native Zig Golden Path
projectSlug: native-zig-golden-path
targets:
  - os: darwin
    architecture: amd64
    targetTriple: x86_64-macos
    tier: secondary
    execution: true
  - os: darwin
    architecture: arm64
    targetTriple: aarch64-macos
    tier: secondary
    execution: true
  - os: linux
    architecture: amd64
    targetTriple: x86_64-linux-musl
    tier: primary
    execution: true
  - os: linux
    architecture: arm64
    targetTriple: aarch64-linux-musl
    tier: secondary
    execution: true
components:
  - name: zig-cli
    path: components/zig-cli
    profiles: [zig]
    artifactTypes: [cli]
  - name: zig-cc
    path: components/zig-cc
    profiles: [zig-toolchain]
    artifactTypes: [binary]
