name: Developer Tooling / Conformance

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-path-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    uses: 5010-dev/engineering-tooling/.github/workflows/golden-path-quality.yml@46e9175e2f97b192ef61a5a0320a396f87b9e5ca
    with:
      runner: ubuntu-24.04
      working-directory: .
      profiles: '["go"]'
      checker-version: '1.0.1'
      source-commit: '46e9175e2f97b192ef61a5a0320a396f87b9e5ca'
      github-cli-version: '2.97.0'
      darwin-amd64-sha256: 'adcb2e5c4a2f17f800541f7ce05fccf3353ce08df1837ed065a273ecdf970803'
      darwin-arm64-sha256: '19e73bcc19c16953dda1241beaa016004eb6e4e8d7cdc96ef090b942d88cbce6'
      linux-amd64-sha256: '9d22518948b1cb0294aaa58c2079942a1434bd2fe3113417782e7b418182e1b7'
      linux-arm64-sha256: 'b500e89ea7a2a171b520ed55a174a58a935b0d2346419fbb06fcec2819b0147e'
