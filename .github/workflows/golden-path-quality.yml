name: Golden Path / Reusable quality

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub runner selected by the caller.
        required: false
        default: ubuntu-24.04
        type: string
      working-directory:
        description: Repository-relative build root.
        required: false
        default: .
        type: string
      profiles:
        description: Exact JSON array of caller-selected profiles.
        required: true
        type: string
      checker-version:
        description: Exact Golden Path release version.
        required: true
        type: string
      source-commit:
        description: Full source commit bound by the release provenance.
        required: true
        type: string
      github-cli-version:
        description: Exact GitHub CLI version used for attestation verification.
        required: true
        type: string
      darwin-amd64-sha256:
        required: true
        type: string
      darwin-arm64-sha256:
        required: true
        type: string
      linux-amd64-sha256:
        required: true
        type: string
      linux-arm64-sha256:
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate immutable caller contract
        shell: bash
        env:
          CHECKER_VERSION: ${{ inputs.checker-version }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
          GITHUB_CLI_VERSION: ${{ inputs.github-cli-version }}
          DARWIN_AMD64_SHA256: ${{ inputs.darwin-amd64-sha256 }}
          DARWIN_ARM64_SHA256: ${{ inputs.darwin-arm64-sha256 }}
          LINUX_AMD64_SHA256: ${{ inputs.linux-amd64-sha256 }}
          LINUX_ARM64_SHA256: ${{ inputs.linux-arm64-sha256 }}
        run: |
          set -euo pipefail
          [[ "$CHECKER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for checksum in \
            "$DARWIN_AMD64_SHA256" "$DARWIN_ARM64_SHA256" \
            "$LINUX_AMD64_SHA256" "$LINUX_ARM64_SHA256"; do
            [[ "$checksum" =~ ^[a-f0-9]{64}$ ]]
          done

      - name: Prepare isolated GitHub CLI verifier
        id: verifier-toolchain
        shell: bash
        env:
          GITHUB_CLI_VERSION: ${{ inputs.github-cli-version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_CLI_VERSION" != '2.97.0' ]]; then
            printf '%s\n' 'The reusable workflow accepts only its release-pinned GitHub CLI version.' >&2
            exit 2
          fi
          case "${RUNNER_OS}/${RUNNER_ARCH}" in
            Linux/X64) mise_sha256=e1fc2899f2bc7dfe9a3553f4c2d5944cf69d11b5f561545504a20f1e11cd6cc5 ;;
            Linux/ARM64) mise_sha256=7d96bad004ba706d7ce4e999113f61296ff317ad23754471743be883817e8a75 ;;
            macOS/X64) mise_sha256=89a8a7d0dd0536da4666d51eb7d9a2a3ffbc0546f00efa9d36041958b642cb48 ;;
            macOS/ARM64) mise_sha256=ad914875be24906afc35bca71c2da0f8ef0f74c450937a9701c03e0e992b6be6 ;;
            *) printf '%s\n' 'Unsupported Golden Path verifier runner.' >&2; exit 2 ;;
          esac
          mkdir -p \
            "$RUNNER_TEMP/golden-path-verifier/config" \
            "$RUNNER_TEMP/golden-path-verifier/project" \
            "$RUNNER_TEMP/golden-path-verifier/runner-cli-guard" \
            "$RUNNER_TEMP/golden-path-verifier/system-config"
          printf '%s\n' '[tools]' 'node = "999.0.0"' \
            >"$RUNNER_TEMP/golden-path-verifier/mise.toml"
          printf '%s\n' '[tools]' 'node = "999.0.0"' \
            >"$RUNNER_TEMP/golden-path-verifier/config/config.toml"
          : >"$RUNNER_TEMP/golden-path-verifier/config/empty.toml"
          printf '%s\n' '[tools]' 'node = "999.0.0"' \
            >"$RUNNER_TEMP/golden-path-verifier/system-config/config.toml"
          : >"$RUNNER_TEMP/golden-path-verifier/system-config/empty.toml"
          printf '%s\n' \
            'min_version = "2026.7.18"' \
            '' \
            '[tools]' \
            "github-cli = \"$GITHUB_CLI_VERSION\"" \
            '' \
            '[settings]' \
            'lockfile = true' \
            >"$RUNNER_TEMP/golden-path-verifier/project/mise.toml"
          cat >"$RUNNER_TEMP/golden-path-verifier/project/mise.lock" <<'EOF'
          [[tools.github-cli]]
          version = "2.97.0"
          backend = "aqua:cli/cli"

          [tools.github-cli."platforms.linux-arm64"]
          checksum = "sha256:73ea440ecad9c9e284429997ee6f93577bc6f7bc6fba357ef62c53ad8fb641a5"
          url = "https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_arm64.tar.gz"
          url_api = "https://api.github.com/repos/cli/cli/releases/assets/496108278"
          provenance = "github-attestations"

          [tools.github-cli."platforms.linux-x64"]
          checksum = "sha256:a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112"
          url = "https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz"
          url_api = "https://api.github.com/repos/cli/cli/releases/assets/496108269"
          provenance = "github-attestations"

          [tools.github-cli."platforms.macos-arm64"]
          checksum = "sha256:a58b8fd77b417a38f47a0b54d1370c59b0fcdb324ccc9ca002b0998f7c4c999e"
          url = "https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_macOS_arm64.zip"
          url_api = "https://api.github.com/repos/cli/cli/releases/assets/496108298"
          provenance = "github-attestations"

          [tools.github-cli."platforms.macos-x64"]
          checksum = "sha256:63298c998cc2a924c9e254c6af6a1caad6ece281122687a91f079bc0a462700e"
          url = "https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_macOS_amd64.zip"
          url_api = "https://api.github.com/repos/cli/cli/releases/assets/496108300"
          provenance = "github-attestations"
          EOF
          cat >"$RUNNER_TEMP/golden-path-verifier/runner-cli-guard/gh" <<'EOF'
          #!/bin/sh
          printf '%s\n' 'The runner-bundled GitHub CLI must not verify Golden Path artifacts.' >&2
          exit 97
          EOF
          chmod 0755 "$RUNNER_TEMP/golden-path-verifier/runner-cli-guard/gh"
          printf 'mise-sha256=%s\n' "$mise_sha256" >>"$GITHUB_OUTPUT"

      - name: Install exact GitHub CLI verifier
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          MISE_CACHE_DIR: ${{ runner.temp }}/golden-path-verifier/cache
          MISE_CEILING_PATHS: ${{ runner.temp }}/golden-path-verifier
          MISE_CONFIG_DIR: ${{ runner.temp }}/golden-path-verifier/config
          MISE_DATA_DIR: ${{ runner.temp }}/golden-path-verifier/data
          MISE_GLOBAL_CONFIG_FILE: ${{ runner.temp }}/golden-path-verifier/config/empty.toml
          MISE_LOCKED: "1"
          MISE_STATE_DIR: ${{ runner.temp }}/golden-path-verifier/state
          MISE_SYSTEM_CONFIG_DIR: ${{ runner.temp }}/golden-path-verifier/system-config
          MISE_SYSTEM_CONFIG_FILE: ${{ runner.temp }}/golden-path-verifier/system-config/empty.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ runner.temp }}/golden-path-verifier/project
        with:
          version: 2026.7.18
          sha256: ${{ steps.verifier-toolchain.outputs.mise-sha256 }}
          working_directory: ${{ runner.temp }}/golden-path-verifier/project
          install: true
          install_args: --locked
          cache: false
          add_shims_to_path: false
          env: false
          export_path: false

      - name: Set up verified Golden Path executable
        id: golden-path
        shell: bash
        env:
          CHECKER_VERSION: ${{ inputs.checker-version }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
          GITHUB_CLI_VERSION: ${{ inputs.github-cli-version }}
          GH_TOKEN: ${{ github.token }}
          MISE_CACHE_DIR: ${{ runner.temp }}/golden-path-verifier/cache
          MISE_CEILING_PATHS: ${{ runner.temp }}/golden-path-verifier
          MISE_CONFIG_DIR: ${{ runner.temp }}/golden-path-verifier/config
          MISE_DATA_DIR: ${{ runner.temp }}/golden-path-verifier/data
          MISE_GLOBAL_CONFIG_FILE: ${{ runner.temp }}/golden-path-verifier/config/empty.toml
          MISE_LOCKED: "1"
          MISE_STATE_DIR: ${{ runner.temp }}/golden-path-verifier/state
          MISE_SYSTEM_CONFIG_DIR: ${{ runner.temp }}/golden-path-verifier/system-config
          MISE_SYSTEM_CONFIG_FILE: ${{ runner.temp }}/golden-path-verifier/system-config/empty.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ runner.temp }}/golden-path-verifier/project
          DARWIN_AMD64_SHA256: ${{ inputs.darwin-amd64-sha256 }}
          DARWIN_ARM64_SHA256: ${{ inputs.darwin-arm64-sha256 }}
          LINUX_AMD64_SHA256: ${{ inputs.linux-amd64-sha256 }}
          LINUX_ARM64_SHA256: ${{ inputs.linux-arm64-sha256 }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/golden-path-verifier/runner-cli-guard:$PATH"
          guard_status=0
          gh version >/dev/null 2>&1 || guard_status=$?
          if [[ "$guard_status" -ne 97 ]]; then
            printf '%s\n' 'The runner-CLI guard is not in effect.' >&2
            exit 3
          fi
          case "${RUNNER_OS}/${RUNNER_ARCH}" in
            macOS/X64) os=darwin; architecture=amd64; expected="$DARWIN_AMD64_SHA256" ;;
            macOS/ARM64) os=darwin; architecture=arm64; expected="$DARWIN_ARM64_SHA256" ;;
            Linux/X64) os=linux; architecture=amd64; expected="$LINUX_AMD64_SHA256" ;;
            Linux/ARM64) os=linux; architecture=arm64; expected="$LINUX_ARM64_SHA256" ;;
            *) printf '%s\n' 'Unsupported Golden Path runner.' >&2; exit 2 ;;
          esac
          archive="golden-path_${CHECKER_VERSION}_${os}_${architecture}.tar.gz"
          staging="$(mktemp -d "${RUNNER_TEMP}/golden-path.XXXXXX")"
          trap 'rm -rf "$staging"' EXIT HUP INT TERM
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 120 \
            --output "$staging/$archive" \
            "https://github.com/5010-dev/engineering-tooling/releases/download/v${CHECKER_VERSION}/$archive"
          actual="$(shasum -a 256 "$staging/$archive" | awk '{print $1}')"
          test "$actual" = "$expected"
          mise_binary="$MISE_DATA_DIR/bin/mise"
          test "$("$mise_binary" --version | awk 'NR == 1 { print $1 }')" = '2026.7.18'
          gh_binary="$("$mise_binary" -C "$RUNNER_TEMP/golden-path-verifier/project" which gh)"
          test "$("$gh_binary" version | awk 'NR == 1 { print $3 }')" = "$GITHUB_CLI_VERSION"
          "$gh_binary" attestation verify "$staging/$archive" \
            --repo 5010-dev/engineering-tooling \
            --signer-workflow 5010-dev/engineering-tooling/.github/workflows/release.yml \
            --source-digest "$SOURCE_COMMIT" \
            --signer-digest "$SOURCE_COMMIT" \
            --source-ref "refs/tags/v$CHECKER_VERSION" \
            --deny-self-hosted-runners >/dev/null
          mkdir "$staging/unpacked"
          tar -xzf "$staging/$archive" -C "$staging/unpacked"
          candidate="$staging/unpacked/golden-path/golden-path"
          chmod 0755 "$candidate"
          test "$("$candidate" --version)" = "golden-path $CHECKER_VERSION"
          install_directory="$RUNNER_TEMP/golden-path/$CHECKER_VERSION"
          mkdir -p "$install_directory"
          install -m 0755 "$candidate" "$install_directory/golden-path"
          printf 'binary-path=%s\n' "$install_directory/golden-path" >> "$GITHUB_OUTPUT"

      - name: Install consumer-pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Select one evaluation time
        shell: bash
        run: echo "GOLDEN_PATH_EVALUATED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Initialize locked dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          GOLDEN_PATH_BIN: ${{ steps.golden-path.outputs.binary-path }}
        run: just init

      - name: Run canonical quality gate
        working-directory: ${{ inputs.working-directory }}
        env:
          GOLDEN_PATH_BIN: ${{ steps.golden-path.outputs.binary-path }}
        run: just ci

      - name: Publish bounded conformance evidence
        if: ${{ always() && steps.golden-path.outcome == 'success' }}
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          EXPECTED_PROFILES: ${{ inputs.profiles }}
          GOLDEN_PATH_BIN: ${{ steps.golden-path.outputs.binary-path }}
        run: |
          set -euo pipefail
          check_arguments=(
            --root .
            --evaluated-at "$GOLDEN_PATH_EVALUATED_AT"
            --json-output "$RUNNER_TEMP/golden-path-result.json"
            --github-summary-output "$GITHUB_STEP_SUMMARY"
            --github-annotations
          )
          check_help="$("$GOLDEN_PATH_BIN" check --help 2>&1 || true)"
          if grep -q -- '-expected-profiles' <<<"$check_help"; then
            check_arguments+=(--expected-profiles "$EXPECTED_PROFILES")
          else
            printf '%s\n' 'The selected legacy checker does not support exact caller-profile comparison.' >&2
          fi
          status=0
          "$GOLDEN_PATH_BIN" check "${check_arguments[@]}" || status=$?
          if [[ "$status" -eq 1 ]]; then
            printf '%s\n' 'Golden Path conformance is report-only; see the emitted evidence.' >&2
            exit 0
          fi
          exit "$status"
