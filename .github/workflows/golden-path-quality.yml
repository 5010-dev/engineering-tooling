name: Golden Path / Reusable quality

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub runner selected by the caller.
        required: false
        default: ubuntu-24.04
        type: string
      working-directory:
        description: Repository-relative build root.
        required: false
        default: .
        type: string
      profiles:
        description: Exact JSON array of caller-selected profiles.
        required: true
        type: string
      checker-version:
        description: Exact Golden Path release version.
        required: true
        type: string
      source-commit:
        description: Full source commit bound by the release provenance.
        required: true
        type: string
      github-cli-version:
        description: Exact GitHub CLI version used for attestation verification.
        required: true
        type: string
      darwin-amd64-sha256:
        required: true
        type: string
      darwin-arm64-sha256:
        required: true
        type: string
      linux-amd64-sha256:
        required: true
        type: string
      linux-arm64-sha256:
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate immutable caller contract
        shell: bash
        env:
          CHECKER_VERSION: ${{ inputs.checker-version }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
          GITHUB_CLI_VERSION: ${{ inputs.github-cli-version }}
          DARWIN_AMD64_SHA256: ${{ inputs.darwin-amd64-sha256 }}
          DARWIN_ARM64_SHA256: ${{ inputs.darwin-arm64-sha256 }}
          LINUX_AMD64_SHA256: ${{ inputs.linux-amd64-sha256 }}
          LINUX_ARM64_SHA256: ${{ inputs.linux-arm64-sha256 }}
        run: |
          set -euo pipefail
          [[ "$CHECKER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for checksum in \
            "$DARWIN_AMD64_SHA256" "$DARWIN_ARM64_SHA256" \
            "$LINUX_AMD64_SHA256" "$LINUX_ARM64_SHA256"; do
            [[ "$checksum" =~ ^[a-f0-9]{64}$ ]]
          done

      - name: Install consumer-pinned toolchain and verifier
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Set up verified Golden Path executable
        id: golden-path
        shell: bash
        env:
          CHECKER_VERSION: ${{ inputs.checker-version }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
          GITHUB_CLI_VERSION: ${{ inputs.github-cli-version }}
          GH_TOKEN: ${{ github.token }}
          DARWIN_AMD64_SHA256: ${{ inputs.darwin-amd64-sha256 }}
          DARWIN_ARM64_SHA256: ${{ inputs.darwin-arm64-sha256 }}
          LINUX_AMD64_SHA256: ${{ inputs.linux-amd64-sha256 }}
          LINUX_ARM64_SHA256: ${{ inputs.linux-arm64-sha256 }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS}/${RUNNER_ARCH}" in
            macOS/X64) os=darwin; architecture=amd64; expected="$DARWIN_AMD64_SHA256" ;;
            macOS/ARM64) os=darwin; architecture=arm64; expected="$DARWIN_ARM64_SHA256" ;;
            Linux/X64) os=linux; architecture=amd64; expected="$LINUX_AMD64_SHA256" ;;
            Linux/ARM64) os=linux; architecture=arm64; expected="$LINUX_ARM64_SHA256" ;;
            *) printf '%s\n' 'Unsupported Golden Path runner.' >&2; exit 2 ;;
          esac
          archive="golden-path_${CHECKER_VERSION}_${os}_${architecture}.tar.gz"
          staging="$(mktemp -d "${RUNNER_TEMP}/golden-path.XXXXXX")"
          trap 'rm -rf "$staging"' EXIT HUP INT TERM
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 120 \
            --output "$staging/$archive" \
            "https://github.com/5010-dev/engineering-tooling/releases/download/v${CHECKER_VERSION}/$archive"
          actual="$(shasum -a 256 "$staging/$archive" | awk '{print $1}')"
          test "$actual" = "$expected"
          test "$(gh version | awk 'NR == 1 { print $3 }')" = "$GITHUB_CLI_VERSION"
          gh attestation verify "$staging/$archive" \
            --repo 5010-dev/engineering-tooling \
            --signer-workflow 5010-dev/engineering-tooling/.github/workflows/release.yml \
            --source-digest "$SOURCE_COMMIT" \
            --signer-digest "$SOURCE_COMMIT" \
            --source-ref "refs/tags/v$CHECKER_VERSION" \
            --deny-self-hosted-runners >/dev/null
          mkdir "$staging/unpacked"
          tar -xzf "$staging/$archive" -C "$staging/unpacked"
          candidate="$staging/unpacked/golden-path/golden-path"
          chmod 0755 "$candidate"
          test "$("$candidate" --version)" = "golden-path $CHECKER_VERSION"
          install_directory="$RUNNER_TEMP/golden-path/$CHECKER_VERSION"
          mkdir -p "$install_directory"
          install -m 0755 "$candidate" "$install_directory/golden-path"
          printf 'binary-path=%s\n' "$install_directory/golden-path" >> "$GITHUB_OUTPUT"

      - name: Select one evaluation time
        shell: bash
        run: echo "GOLDEN_PATH_EVALUATED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Initialize locked dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          GOLDEN_PATH_BIN: ${{ steps.golden-path.outputs.binary-path }}
        run: just init

      - name: Run canonical quality gate
        working-directory: ${{ inputs.working-directory }}
        env:
          GOLDEN_PATH_BIN: ${{ steps.golden-path.outputs.binary-path }}
        run: just ci

      - name: Publish bounded conformance evidence
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          EXPECTED_PROFILES: ${{ inputs.profiles }}
          GOLDEN_PATH_BIN: ${{ steps.golden-path.outputs.binary-path }}
        run: |
          set -euo pipefail
          check_arguments=(
            --root .
            --evaluated-at "$GOLDEN_PATH_EVALUATED_AT"
            --json-output "$RUNNER_TEMP/golden-path-result.json"
            --github-summary-output "$GITHUB_STEP_SUMMARY"
            --github-annotations
          )
          check_help="$("$GOLDEN_PATH_BIN" check --help 2>&1 || true)"
          if grep -q -- '-expected-profiles' <<<"$check_help"; then
            check_arguments+=(--expected-profiles "$EXPECTED_PROFILES")
          else
            printf '%s\n' 'The selected legacy checker does not support exact caller-profile comparison.' >&2
          fi
          status=0
          "$GOLDEN_PATH_BIN" check "${check_arguments[@]}" || status=$?
          if [[ "$status" -eq 1 ]]; then
            printf '%s\n' 'Golden Path conformance is report-only; see the emitted evidence.' >&2
            exit 0
          fi
          exit "$status"
