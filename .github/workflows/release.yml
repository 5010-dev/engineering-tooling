name: Publish Golden Path Agent

on:
  push:
    tags:
      - golden-path-agent-v*.*.*

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Verify tag points at validated main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          test "$TAG_NAME" = "golden-path-agent-v$package_version"
          tag_commit="$(git rev-parse HEAD)"
          main_commit="$(gh api --hostname github.com "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$tag_commit" = "$main_commit"

      - name: Install locked dependencies
        run: just init

      - name: Reproduce canonical package validation
        env:
          GOLDEN_PATH_AGENT_PACKAGE_OUTPUT: ${{ runner.temp }}/golden-path-agent-release
        run: just ci

      - name: Bind exact validated release candidate
        id: release_candidate
        env:
          PACKAGE_OUTPUT: ${{ runner.temp }}/golden-path-agent-release
        run: |
          set -euo pipefail
          evidence="$PACKAGE_OUTPUT/package-evidence.json"
          tarball="$(node -p "require(process.argv[1]).filename" "$evidence")"
          sha256="$(node -p "require(process.argv[1]).sha256" "$evidence")"
          integrity="$(node -p "require(process.argv[1]).integrity" "$evidence")"
          test -f "$tarball"
          test "$(shasum -a 256 "$tarball" | awk '{print $1}')" = "$sha256"
          {
            echo "tarball=$tarball"
            echo "sha256=$sha256"
            echo "integrity=$integrity"
          } >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Packages authentication
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: ./scripts/pnpm config set --location=user "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"

      - name: Publish private GitHub Package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: ./scripts/pnpm publish "${{ steps.release_candidate.outputs.tarball }}" --no-git-checks

      - name: Verify published package identity and integrity
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          published_version=''
          published_integrity=''
          for _ in {1..10}; do
            published_version="$(./scripts/pnpm view "@5010-dev/golden-path-agent@$package_version" version --json 2>/dev/null | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(value)))" || true)"
            published_integrity="$(./scripts/pnpm view "@5010-dev/golden-path-agent@$package_version" dist.integrity --json 2>/dev/null | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(value)))" || true)"
            if [ "$published_version" = "$package_version" ] && [ "$published_integrity" = "${{ steps.release_candidate.outputs.integrity }}" ]; then
              break
            fi
            sleep 3
          done
          test "$published_version" = "$package_version"
          test "$published_integrity" = "${{ steps.release_candidate.outputs.integrity }}"
          package_visibility=''
          for _ in {1..10}; do
            package_visibility="$(gh api --hostname github.com "orgs/${GITHUB_REPOSITORY_OWNER}/packages/npm/golden-path-agent" --jq .visibility 2>/dev/null || true)"
            if [ "$package_visibility" = 'private' ]; then
              break
            fi
            sleep 3
          done
          test "$package_visibility" = 'private'
          {
            echo '## Published package evidence'
            echo
            echo "- Package: \`@5010-dev/golden-path-agent@$published_version\`"
            echo "- Tarball SHA-256: \`sha256:${{ steps.release_candidate.outputs.sha256 }}\`"
            echo "- Registry integrity: \`$published_integrity\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Publisher: \`$GITHUB_ACTOR\` via \`$GITHUB_WORKFLOW_REF\` run \`$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT\`"
            echo "- Access: manifest \`restricted\`; registry visibility \`$package_visibility\` at \`https://npm.pkg.github.com\`"
            echo "- Toolchain: \`$(node --version)\`; \`$(./scripts/pnpm --version)\`"
          } >> "$GITHUB_STEP_SUMMARY"
